<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141911"><title>Borowy — Leśny Strażnik</title><link rel="stylesheet" href="src/style.css"></head><body><main><section class="game-shell" aria-label="Gra Leśny Strażnik"><div class="stage"><canvas id="game" width="480" height="320" tabindex="0" aria-label="Świat proceduralny. WASD lub strzałki: ruch. Spacja: atak. Shift: unik."></canvas>
<div class="hud"><div class="character"><canvas id="portrait" width="32" height="32" aria-label="Portret strażnika"></canvas><div class="meters"><div class="meter health" aria-label="Zdrowie 6 z 6"><i id="health-fill"></i></div><div class="meter stamina" aria-label="Gotowość uniku"><i id="stamina-fill"></i></div><div class="meter experience"><i id="xp-fill"></i></div><small id="xp-label">0 / 40 PD</small><span><b id="level">Lv. 1</b> <small>LEŚNY STRAŻNIK</small></span></div></div><div class="map-panel"><span class="north">N</span><canvas id="minimap" width="80" height="80" aria-label="Mapa najbliższej okolicy"></canvas><span id="biome">STARY BÓR</span></div></div>
<div class="quest-panel"><strong>Na leśnym szlaku</strong><p>◇ Odkrywaj osady i pradawne runy</p><small id="quest">Początek wyprawy</small></div>
<div id="notice" role="status"></div><div class="touch-controls"><div id="stick" aria-label="Joystick ruchu"><b class="up">▴</b><b class="left">◂</b><b class="right">▸</b><b class="down">▾</b><span></span></div><div class="touch-actions"><button id="dash" aria-label="Unik">❖<small>SHIFT · UNIK</small></button><button id="attack" aria-label="Atak mieczem">⚔<small>SPACJA</small></button></div></div>
<div id="overlay" hidden><span class="eyebrow">BOROWY</span><h2 id="pause-title">Las poczeka.</h2><p>WASD / strzałki — ruch<br>Spacja — miecz · Shift — unik</p><button id="resume">Wróć do gry →</button></div></div>
<div class="game-bottom"><span class="brand">BOROWY <small>0.7</small></span><b id="runes">◇ 0</b><span id="coords"></span><span id="seed"></span><span id="state"></span><button id="sound" aria-pressed="false">Dźwięk: wył.</button><button id="new-world">Nowy świat</button><button id="reset">Restart</button><button id="pause" aria-label="Pauza">Ⅱ</button></div></section></main><script type="module" src="src/game.js?v=0.12.0"></script></body></html>
